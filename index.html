<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prijskaartjes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaartjes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6f3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --card-w: 65mm;
    --card-h: 32mm;
    --groen: #1a7f37;
    --groen-donker: #146c2e;
    --grond: #f3f6f3;
    --vlak: #ffffff;
    --tekst: #17201a;
    --zacht: #66706a;
    --lijn: #d9e0db;
    --rood: #c0262d;
    --veilig-onder: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--grond);
    color: var(--tekst);
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- scherm ---------- */
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(var(--veilig-onder) + 110px);
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  #teller { color: var(--zacht); font-size: 15px; font-variant-numeric: tabular-nums; }

  #lijst { display: flex; flex-direction: column; gap: 10px; }
  .rij {
    background: var(--vlak);
    border: 1px solid var(--lijn);
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 96px;
    gap: 8px;
  }
  .rij.uit { opacity: .45; }
  .rij input {
    font: inherit; font-size: 17px; color: var(--tekst);
    width: 100%; min-width: 0;
    padding: 11px 12px;
    border: 1px solid var(--lijn); border-radius: 10px;
    background: var(--grond);
    -webkit-appearance: none; appearance: none;
  }
  .rij input:focus { outline: 2px solid var(--groen); outline-offset: -1px; background: #fff; }
  .rij .prijs-veld { position: relative; }
  .rij .prijs-veld span {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--zacht); font-size: 17px; pointer-events: none;
  }
  .rij .prijs-veld input { padding-left: 26px; font-variant-numeric: tabular-nums; }
  .onder {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button, .weg {
    font: inherit; border: 1px solid var(--lijn); background: var(--vlak);
    color: var(--tekst); border-radius: 10px; height: 40px; min-width: 44px;
    font-size: 20px; cursor: pointer;
  }
  .stepper output {
    min-width: 76px; text-align: center; font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .weg { color: var(--rood); font-size: 15px; padding: 0 12px; }
  .weg.zeker { background: var(--rood); color: #fff; border-color: var(--rood); }

  #toevoegen {
    margin-top: 10px; width: 100%;
    font: inherit; font-size: 17px; font-weight: 600;
    padding: 14px; border-radius: 14px;
    border: 2px dashed var(--lijn); background: transparent; color: var(--groen);
    cursor: pointer;
  }

  #voorbeeld-kop {
    margin: 26px 0 8px; font-size: 13px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--zacht);
  }
  #voorbeeld { overflow: hidden; }
  #vellen { transform-origin: top left; }
  .vel {
    width: 210mm; min-height: 297mm;
    background: #fff; padding: 6mm;
    box-shadow: 0 1px 8px rgba(0,0,0,.18);
    margin-bottom: 8mm;
    display: grid;
    grid-template-columns: repeat(3, var(--card-w));
    grid-auto-rows: var(--card-h);
    align-content: start;
  }

  #wissen {
    display: block; margin: 18px auto 0;
    font: inherit; font-size: 15px; background: none; border: 0;
    color: var(--zacht); text-decoration: underline; cursor: pointer; padding: 8px;
  }
  #wissen.zeker { color: var(--rood); font-weight: 600; }

  #balk {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 16px calc(var(--veilig-onder) + 12px);
    background: rgba(243,246,243,.92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--lijn);
  }
  #afdrukken {
    display: block; width: 100%; max-width: 528px; margin: 0 auto;
    font: inherit; font-size: 19px; font-weight: 700; color: #fff;
    background: var(--groen); border: 0; border-radius: 14px;
    padding: 16px; cursor: pointer;
  }
  #afdrukken:active { background: var(--groen-donker); }
  #afdrukken:disabled { background: #a9b8ad; }
  button:focus-visible { outline: 3px solid var(--groen); outline-offset: 2px; }

  /* ---------- kaartje (zelfde als PRIJSKAARTJEMAKER.html) ---------- */
  .card {
    width: var(--card-w);
    height: var(--card-h);
    border: 0.6mm solid #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 1mm 1.5mm;
    break-inside: avoid;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
  }
  .card .naam {
    font-weight: bold;
    font-size: 26pt;
    line-height: 1.05;
    white-space: nowrap;
  }
  .card .prijs {
    font-weight: bold;
    font-size: 30pt;
    line-height: 1.1;
  }

  /* ---------- afdrukken ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    #app > :not(#voorbeeld), #balk { display: none !important; }
    #app { padding: 0; max-width: none; }
    #voorbeeld { overflow: visible; height: auto !important; }
    #vellen { transform: none !important; }
    .vel { box-shadow: none; margin: 0; min-height: 0; break-after: page; }
    .vel:last-child { break-after: auto; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Prijskaartjes</h1>
    <span id="teller"></span>
  </header>

  <div id="lijst"></div>
  <button id="toevoegen" type="button">+ Product toevoegen</button>

  <div id="voorbeeld-kop">Voorbeeld</div>
  <div id="voorbeeld"><div id="vellen"></div></div>

  <button id="wissen" type="button">Alles wissen</button>
</div>

<div id="balk">
  <button id="afdrukken" type="button">Afdrukken</button>
</div>

<script>
const STORAGE_KEY = 'prijskaartjes-v1';
const PER_VEL = 24; // 3 kolommen x 8 rijen op A4
const lijstEl = document.getElementById('lijst');
const vellenEl = document.getElementById('vellen');
const voorbeeldEl = document.getElementById('voorbeeld');
const tellerEl = document.getElementById('teller');
const printBtn = document.getElementById('afdrukken');
let items = [];
let volgendId = 1;

function nieuwItem(naam = '', prijs = '', aantal = 3) {
  return { id: volgendId++, naam, prijs, aantal };
}

function load() {
  let opgeslagen = null;
  try { opgeslagen = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (Array.isArray(opgeslagen) && opgeslagen.length) {
    items = opgeslagen.map(it => nieuwItem(it.naam || '', it.prijs || '', Number.isFinite(it.aantal) ? it.aantal : 3));
  } else {
    items = [nieuwItem('Appelsap 5 liter', '12,50'), nieuwItem('Courgette', '1,50'), nieuwItem('Spruiten', '3')];
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}

function save() {
  const data = items.map(({ naam, prijs, aantal }) => ({ naam, prijs, aantal }));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function formatPrijs(raw) {
  let p = raw.trim().replace(/^€\s*/, '').replace(/\./, ',');
  if (!p) return '';
  return '€ ' + p;
}

/* ---------- lijst ---------- */
function bouwRij(it) {
  const rij = document.createElement('div');
  rij.className = 'rij';
  rij.innerHTML = `
    <input type="text" class="naam" placeholder="Product" enterkeyhint="next" autocapitalize="sentences" aria-label="Product">
    <div class="prijs-veld"><span>€</span><input type="text" class="prijs" placeholder="0,00" inputmode="decimal" enterkeyhint="done" aria-label="Prijs"></div>
    <div class="onder">
      <div class="stepper">
        <button type="button" class="min" aria-label="Minder">−</button>
        <output class="aantal"></output>
        <button type="button" class="plus" aria-label="Meer">+</button>
      </div>
      <button type="button" class="weg">Verwijderen</button>
    </div>`;
  const naam = rij.querySelector('.naam');
  const prijs = rij.querySelector('.prijs');
  const aantal = rij.querySelector('.aantal');
  naam.id = 'naam-' + it.id;
  prijs.id = 'prijs-' + it.id;
  naam.value = it.naam;
  prijs.value = it.prijs;

  const toonAantal = () => {
    aantal.textContent = it.aantal === 0 ? 'niet' : it.aantal + (it.aantal === 1 ? ' kaartje' : ' kaartjes');
    rij.classList.toggle('uit', it.aantal === 0);
  };
  toonAantal();

  naam.addEventListener('input', () => { it.naam = naam.value; wijziging(); });
  prijs.addEventListener('input', () => { it.prijs = prijs.value; wijziging(); });
  naam.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); prijs.focus(); } });
  prijs.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); prijs.blur(); } });
  rij.querySelector('.min').addEventListener('click', () => { it.aantal = Math.max(0, it.aantal - 1); toonAantal(); wijziging(); });
  rij.querySelector('.plus').addEventListener('click', () => { it.aantal = Math.min(99, it.aantal + 1); toonAantal(); wijziging(); });

  const weg = rij.querySelector('.weg');
  let wegTimer = null;
  weg.addEventListener('click', () => {
    if (!weg.classList.contains('zeker')) {
      weg.classList.add('zeker');
      weg.textContent = 'Zeker?';
      wegTimer = setTimeout(() => { weg.classList.remove('zeker'); weg.textContent = 'Verwijderen'; }, 3000);
      return;
    }
    clearTimeout(wegTimer);
    items = items.filter(x => x !== it);
    rij.remove();
    wijziging();
  });
  return rij;
}

function bouwLijst() {
  lijstEl.innerHTML = '';
  for (const it of items) lijstEl.appendChild(bouwRij(it));
}

document.getElementById('toevoegen').addEventListener('click', () => {
  const it = nieuwItem();
  items.push(it);
  const rij = bouwRij(it);
  lijstEl.appendChild(rij);
  wijziging();
  rij.querySelector('.naam').focus();
});

const wissen = document.getElementById('wissen');
let wissenTimer = null;
wissen.addEventListener('click', () => {
  if (!wissen.classList.contains('zeker')) {
    wissen.classList.add('zeker');
    wissen.textContent = 'Tik nog eens om alles te wissen';
    wissenTimer = setTimeout(() => { wissen.classList.remove('zeker'); wissen.textContent = 'Alles wissen'; }, 3000);
    return;
  }
  clearTimeout(wissenTimer);
  wissen.classList.remove('zeker');
  wissen.textContent = 'Alles wissen';
  items = [nieuwItem()];
  bouwLijst();
  wijziging();
});

/* ---------- kaartjes ---------- */
function renderKaartjes() {
  const kaartjes = [];
  for (const it of items) {
    if (!it.naam.trim() && !it.prijs.trim()) continue;
    for (let i = 0; i < it.aantal; i++) kaartjes.push(it);
  }
  vellenEl.innerHTML = '';
  const vellen = Math.max(1, Math.ceil(kaartjes.length / PER_VEL));
  for (let v = 0; v < vellen; v++) {
    const vel = document.createElement('div');
    vel.className = 'vel';
    vellenEl.appendChild(vel);
    for (const it of kaartjes.slice(v * PER_VEL, (v + 1) * PER_VEL)) {
      const card = document.createElement('div');
      card.className = 'card';
      const n = document.createElement('div');
      n.className = 'naam';
      n.textContent = it.naam.trim();
      const p = document.createElement('div');
      p.className = 'prijs';
      p.textContent = formatPrijs(it.prijs);
      card.appendChild(n);
      card.appendChild(p);
      vel.appendChild(card);
      fitText(n);
    }
  }
  tellerEl.textContent = kaartjes.length
    ? kaartjes.length + (kaartjes.length === 1 ? ' kaartje' : ' kaartjes') + ' · ' + vellen + (vellen === 1 ? ' vel' : ' vellen')
    : '';
  printBtn.disabled = kaartjes.length === 0;
  printBtn.textContent = kaartjes.length ? 'Afdrukken (' + vellen + (vellen === 1 ? ' vel)' : ' vellen)') : 'Afdrukken';
  schaal();
}

/* productnaam kleiner maken tot hij op het kaartje past */
function fitText(el) {
  let size = 26;
  el.style.fontSize = size + 'pt';
  const max = el.parentElement.clientWidth - 4;
  while (size > 8 && el.scrollWidth > max) {
    size -= 1;
    el.style.fontSize = size + 'pt';
  }
}

/* voorbeeld verkleinen tot schermbreedte */
function schaal() {
  const velBreedte = vellenEl.firstElementChild ? vellenEl.firstElementChild.offsetWidth : 1;
  const s = Math.min(1, voorbeeldEl.clientWidth / velBreedte);
  vellenEl.style.transform = 'scale(' + s + ')';
  voorbeeldEl.style.height = (vellenEl.offsetHeight * s) + 'px';
}
window.addEventListener('resize', schaal);

let renderTimer = null;
function wijziging() {
  save();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderKaartjes, 120);
}

printBtn.addEventListener('click', () => {
  clearTimeout(renderTimer);
  renderKaartjes();
  document.activeElement && document.activeElement.blur();
  window.print();
});

load();
bouwLijst();
renderKaartjes();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
